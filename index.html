  :root{
    --ink:#000;
    --paper:#ffffff;
    --gray-badge:#e8e8e8;
    --line-w: 1.8px;
    --line-w-box: 2.6px;
    --radius-page: 26px;
    --radius-box: 15px;
  }
  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact; color-adjust:exact; font-synthesis:none;}
  html,body{margin:0;padding:0;background:#e9e4d8;color:#111;font-family:'MabiClassic','Segoe UI',sans-serif;}

  #app{display:flex; min-height:100vh;}

  /* ============ SIDEBAR ============ */
  #sidebar{
    width:340px; flex-shrink:0;
    background:#faf7f0;
    border-right:2px solid #ddd3bd;
    padding:18px 16px 60px;
    overflow-y:auto;
    height:100vh;
    font-family:'Segoe UI', 'Malgun Gothic', sans-serif;
  }
  #sidebar h1{
    font-size:17px; margin:0 0 14px; font-family:'Jiugae','Segoe UI',sans-serif; letter-spacing:-0.3px;
  }
  #sidebar h2{
    font-size:12.5px; color:#8a7a55; margin:22px 0 8px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.4px;
    border-bottom:1px solid #e6ddc8; padding-bottom:5px;
  }
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:12px; color:#555; margin-bottom:4px;}
  .field input[type=text]{
    width:100%; padding:7px 9px; border:1.5px solid #d8cdb2; border-radius:8px;
    font-size:13px; font-family:inherit; background:#fff;
  }
  .mode-toggle{display:flex; gap:6px; margin-bottom:14px;}
  .mode-toggle button{
    flex:1; padding:9px 4px; border:1.5px solid #d8cdb2; background:#fff; border-radius:9px;
    font-size:12.5px; cursor:pointer; font-family:inherit; font-weight:600; color:#666;
  }
  .mode-toggle button.active{ background:#3f3324; color:#fff; border-color:#3f3324;}

  .day-panel{
    background:#fff; border:1.5px solid #e6ddc8; border-radius:12px;
    padding:12px; margin-bottom:12px;
  }
  .day-panel-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .day-panel-head strong{font-size:13.5px;}
  .wt-toggle{font-size:11px; color:#777; display:flex; align-items:center; gap:5px; cursor:pointer;}

  .col-block{margin-top:8px;}
  .col-block-title{font-size:11.5px; color:#8a7a55; font-weight:700; margin-bottom:5px;}
  .preset-chips{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:7px;}
  .chip{
    font-size:11px; background:#f1ecdd; border:1px solid #e0d5b8; border-radius:20px;
    padding:4px 9px; cursor:pointer; color:#5c4d2e; white-space:nowrap;
  }
  .chip:hover{background:#e6ddc4;}
  .item-row{display:flex; gap:5px; margin-bottom:5px; align-items:center;}
  .item-row input{
    flex:1; padding:5px 7px; border:1px solid #ddd; border-radius:6px; font-size:12px; font-family:inherit;
  }
  .item-row button{
    border:none; background:#f3d9d9; color:#a33; border-radius:6px; width:22px; height:22px;
    cursor:pointer; font-size:12px; line-height:1;
  }
  .add-item-row{display:flex; gap:5px;}
  .add-item-row input{flex:1; padding:5px 7px; border:1px solid #ddd; border-radius:6px; font-size:12px; font-family:inherit;}
  .add-item-row button{
    border:none; background:#3f3324; color:#fff; border-radius:6px; padding:0 10px; cursor:pointer; font-size:12px;
  }

  .preset-manager{background:#fff; border:1.5px solid #e6ddc8; border-radius:12px; padding:12px; margin-bottom:12px;}
  .preset-manager-row{display:flex; gap:5px; margin-bottom:8px;}
  .preset-manager-row input{flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:6px; font-size:12px; font-family:inherit;}
  .preset-manager-row select{padding:6px 4px; border:1px solid #ddd; border-radius:6px; font-size:11px; font-family:inherit;}
  .preset-manager-row button{border:none; background:#3f3324; color:#fff; border-radius:6px; padding:0 10px; cursor:pointer; font-size:12px;}
  .preset-list{display:flex; flex-wrap:wrap; gap:5px;}
  .preset-list .chip{position:relative; padding-right:20px;}
  .preset-list .chip .x{position:absolute; right:5px; top:2px; color:#a33; font-weight:700; cursor:pointer;}

  .actions{display:flex; gap:8px; margin-top:20px;}
  .actions button{
    flex:1; padding:11px 4px; border:none; border-radius:10px; cursor:pointer;
    font-size:13px; font-weight:700; font-family:inherit;
  }
  #btnPrint{background:#274c77; color:#fff;}
  #btnPng{background:#3f3324; color:#fff;}
  .hint{font-size:11px; color:#999; margin-top:8px; line-height:1.5;}

  /* ============ STAGE / PAGE ============ */
  #stage{
    flex:1; display:flex; justify-content:center; align-items:flex-start;
    padding:40px 20px; overflow:auto; height:100vh;
  }
  #pageWrap{
    box-shadow:0 12px 34px rgba(0,0,0,.22);
    background:#fff;
  }
  #page{
    width:720px; min-height:1040px; position:relative;
    background:#fff; overflow:visible;
  }

  #pageBorder{
    position:absolute; left:17px; top:37px; right:17px;
    bottom:16px;
    border:var(--line-w-box) solid var(--ink);
    border-radius:var(--radius-page);
    background-color:#fff;
    background-image:
      radial-gradient(circle, #c2c2c2 0.9px, transparent 1.1px),
      radial-gradient(circle, #c2c2c2 0.9px, transparent 1.1px);

    background-position:0 0, 4.7px 4.7px;
  }

  /* ---- ribbon ---- */
  #ribbonWrap{position:absolute; left:68px; top:16px; width:586px; height:104px;}
  #ribbonWrap svg{position:absolute; left:0; top:0; width:100%; height:100%; overflow:visible;}
  .ribbon-stroke-pass{ stroke:var(--ink); stroke-width:var(--line-w); vector-effect:non-scaling-stroke; stroke-linejoin:round; stroke-linecap:round; }
  .ribbon-content{
    position:absolute; left:50%; top:60%; transform:translate(-50%,-50%);

  .ribbon-title{
    font-family:'Jiugae'; font-size:32px; font-weight:400; letter-spacing:-0.3px;

  }
  .ribbon-title .stardeco{font-size:16px;}
  .ribbon-date{
    font-family:'Jiugae'; font-size:16px; letter-spacing:0.3px;
  }
  .star-deco{position:absolute; top:48px; z-index:4;}

  /* ---- day section ---- */
  .day-section{

  .day-body{padding:11px 26px 18px;}

  .wt-row{display:flex; align-items:center; gap:14px; padding-bottom:14px; margin-left:64px;}
  .badge-pill{
    display:inline-flex; align-items:center; gap:11px;

  .list-item .marker{flex-shrink:0; font-size:13px; margin-top:1px; font-family:'Noto Sans KR','Malgun Gothic',sans-serif;}
  .list-item .txt{flex:1; border:none; background:transparent; outline:none; font-family:inherit; font-size:inherit; width:100%;}
  .list-item .txt::placeholder{color:#ccc;}

    flex-shrink:0; border:none; background:none; color:#c66; cursor:pointer; font-size:13px; opacity:0.55;
  }

  /* ---- footer ---- */
  #footerWrap{position:absolute; left:52px; width:637px; height:180px; z-index:6;}
  #footerBox{
    position:absolute; left:0; top:40px; right:0; bottom:0;

    display:flex;

  #burstWrap{position:absolute; left:-50px; top:-7px; width:200px; height:100px; z-index:5;}
  #burstWrap svg{width:100%; height:100%; overflow:visible;}

    display:flex; align-items:center; justify-content:center;
    font-family:'MabiClassic'; font-size:14px; font-weight:400;

  /* ============ PRINT ============ */
  @media print{

    @page{ size:190.5mm 275.2mm; margin:0; }

<body>
<div id="app">
  <aside id="sidebar">
    <h1>📋 Theseus 숙제표 생성기</h1>

    <div class="mode-toggle">

      * 프린트 시 용지 설정에서 "실제 크기" 대신 <b>"자동 맞춤(용지에 맞게)"</b>을 선택하면 A4에 꽉 차게 인쇄돼요.<br>
      * 목록 항목은 프리셋 칩을 클릭하거나 직접 입력 후 추가할 수 있어요.<br>
      * 내용은 이 브라우저에 자동 저장돼요 (다음에 열어도 유지).

  <main id="stage">

          <svg viewBox="0 0 5582180 971670" preserveAspectRatio="none"><path d="M0,0 C166242,25228 494339,2440 626828,0 C759317,-2440 1132193,-6343 1279240,0 C1374544,1013 1453284,18851 1453683,37176 C1449586,55466 1381797,77322 1279240,74352 C1183059,75182 1080002,75946 930354,74352 C835587,71788 753588,93037 755911,111528 C773349,135168 828123,158446 930354,148704 C1113114,151682 1277122,174999 1550599,148704 C1824077,122409 2017090,177016 2170845,148704 C2324600,120392 2639409,170227 2828305,148704 C3017201,127181 3226049,158684 3336906,148704 C3447763,138724 3678967,123469 3957151,148704 C4235336,173939 4310073,164930 4651826,148704 C4747919,148083 4823517,129467 4826269,111528 C4821177,83384 4743548,91745 4651826,74352 C4478504,75409 4374277,67676 4302940,74352 C4210444,77210 4128419,59554 4128497,37176 C4130909,15213 4204774,2895 4302940,0 C4545695,-13511 4699698,-15016 4929768,0 C5159838,15016 5435356,20444 5582180,0 C5466562,80471 5340511,149940 5254227,193397 C5167943,236854 4985126,329132 4884408,411483 C5004343,504666 5162699,587369 5240272,621339 C5317845,655310 5452687,727424 5582180,822966 C5481307,836715 5329878,830243 5211784,822966 C5093690,815689 4995818,824019 4826269,822966 C4829063,859896 4825960,887452 4826269,934494 C4840607,946453 4746378,987573 4651826,971670 C4470405,960328 4274191,986954 4106010,971670 C3937829,956386 3626041,997568 3411335,971670 C3196630,945772 3019833,981277 2865519,971670 C2711205,962063 2529194,996434 2356918,971670 C2184642,946906 2035954,995926 1848317,971670 C1660680,947414 1335579,953003 930354,971670 C836211,973979 755826,955486 755911,934494 C753687,895653 755686,866234 755911,822966 C653559,833723 534846,836797 377956,822966 C221067,809135 115620,822415 0,822966 C159263,723096 285173,654628 362842,608995 C440511,563361 566858,499349 697773,411483 C620890,372546 468231,299204 348887,205742 C229543,112280 151649,108842 0,0 Z" fill="#fff" class="ribbon-stroke-pass"/><path d="M755911,115000 L755911,830000" class="r         <div class="star-deco right"><svg width="52" height="46" viewBox="0 0 52 46"><polygon points="0,0" fill="#CAEEFB" stroke="#000" stroke-width="1.8" stroke-linejoin="round"/></svg></div>

</div>

<script>
const RIBBON_D = "M0,0 C166242,25228 494339,2440 626828,0 C759317,-2440 1132193,-6343 1279240,0 C1374544,1013 1453284,18851 1453683,37176 C1449586,55466 1381797,77322 1279240,74352 C1183059,75182 1080002,75946 930354,74352 C835587,71788 753588,93037 755911,111528 C773349,135168 828123,158446 930354,148704 C1113114,151682 1277122,174999 1550599,148704 C1824077,122409 2017090,177016 2170845,148704 C2324600,120392 2639409,170227 2828305,148704 C3017201,127181 3226049,158684 3336906,148704 C3447763,138724 3678967,123469 3957151,148704 C4235336,173939 4310073,164930 4651826,148704 C4747919,148083 4823517,129467 4826269,111528 C4821177,83384 4743548,91745 4651826,74352 C4478504,75409 4374277,67676 4302940,74352 C4210444,77210 4128419,59554 4128497,37176 C4130909,15213 4204774,2895 4302940,0 C4545695,-13511 4699698,-15016 4929768,0 C5159838,15016 5435356,20444 5582180,0 C5466562,80471 5340511,149940 5254227,193397 C5167943,236854 4985126,329132 4884408,411483 C5004343,504666 5162699,587369 5240272,621339 C5317845,655310 5452687,727424 5582180,822966 C5481307,836715 5329878,830243 5211784,822966 C5093690,815689 4995818,824019 4826269,822966 C4829063,859896 4825960,887452 4826269,934494 C4840607,946453 4746378,987573 4651826,971670 C4470405,960328 4274191,986954 4106010,971670 C3937829,956386 3626041,997568 3411335,971670 C3196630,945772 3019833,981277 2865519,971670 C2711205,962063 2529194,996434 2356918,971670 C2184642,946906 2035954,995926 1848317,971670 C1660680,947414 1335579,953003 930354,971670 C836211,973979 755826,955486 755911,934494 C753687,895653 755686,866234 755911,822966 C653559,833723 534846,836797 377956,822966 C221067,809135 115620,822415 0,822966 C159263,723096 285173,654628 362842,608995 C440511,563361 566858,499349 697773,411483 C620890,372546 468231,299204 348887,205742 C229543,112280 151649,108842 0,0 Z";
const DAYTAG_FILL_D = "M0,52036 C720,30129 29269,-2009 52036,0 C73608,-11058 121948,8627 154870,0 L154870,0 C243185,-11780 271757,18603 387174,0 C609018,-39803 730531,33235 877181,0 C905541,-7870 930513,24113 929217,52036 C938768,92622 918038,155381 929217,182121 L929217,182121 C932995,219169 923592,234852 929217,260173 L929217,260172 C926737,287960 909547,308642 877181,312208 C689397,348163 577662,256671 387174,312208 C392688,331612 390731,343301 392613,352873 C282218,339934 206722,307236 154870,312208 C128448,318783 93235,307220 52036,312208 C29195,318043 -678,288005 0,260172 L0,260173 C-8595,239940 194,199070 0,182121 L0,182121 C-2306,138417 14117,97123 0,52036 Z";
const DAYTAG_STROKES = `<path d="${DAYTAG_FILL_D}" class="day-tag-stroke-pass" fill="none"/>`;
const DAYTAG_VBW = 929217, DAYTAG_VBH = 312208;

const TAG_FILL = { '월요일':'#FEF8D4','화요일':'#FEF8D4','수요일':'#FFD9F1','목요일':'#FFD9F1','금요일':'#DDEBF7' };

const MODES = {
  mwf: ['월요일','수요일','금요일'],
  hmy: ['화요일','목요일']
};

const STORE_KEY = 'theseus-hw-state-v1';
const PRESET_KEY = 'theseus-hw-presets-v1';

let state = {
  mode: 'mwf',
  dateRange: '8/10-14',
  days: {}
};

let presets = { material: [], homework: [] };

function defaultDay(name){
  return {
    wordTestOn: name !== '금요일',
    wordTest: '',
    materials: [],
    homeworks: []
  };
}

function ensureDays(){
  const list = MODES[state.mode];
  list.forEach(d=>{ if(!state.days[d]) state.days[d] = defaultDay(d); });
}

async function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ state = JSON.parse(raw); }
  }catch(e){}
  try{
    const rawP = localStorage.getItem(PRESET_KEY);
    if(rawP){ presets = JSON.parse(rawP); }
  }catch(e){}
  ensureDays();
}
async function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
async function savePresets(){
  try{ localStorage.setItem(PRESET_KEY, JSON.stringify(presets)); }catch(e){}
}

function el(tag, cls, html){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(html!==undefined) e.innerHTML = html;
  return e;
}

/* ---------------- Sidebar rendering ---------------- */
function renderSidebar(){
  document.getElementById('modeMWF').classList.toggle('active', state.mode==='mwf');
  document.getElementById('modeHMY').classList.toggle('active', state.mode==='hmy');
  document.getElementById('dateRange').value = state.dateRange;

  const wrap = document.getElementById('dayPanels');
  wrap.innerHTML = '';
  MODES[state.mode].forEach(day=>{
    const d = state.days[day];
    const panel = el('div','day-panel');

    const head = el('div','day-panel-head');
    head.innerHTML = `<strong>${day}</strong>`;
    const wtToggle = el('label','wt-toggle');
    wtToggle.innerHTML = `<input type="checkbox" ${d.wordTestOn?'checked':''} data-day="${day}" class="wtOnChk"> 단어시험 표시`;
    head.appendChild(wtToggle);
    panel.appendChild(head);

    if(d.wordTestOn){
      const wtField = el('div','field');
      wtField.innerHTML = `<label>단어시험 내용</label>
        <input type="text" class="wtInput" data-day="${day}" placeholder="예: English Coach p.19,20 (총 15개)" value="${escapeAttr(d.wordTest)}">`;
      panel.appendChild(wtField);
    }

    panel.appendChild(buildColBlock(day,'materials','가져올 교재', presets.material));
    panel.appendChild(buildColBlock(day,'homeworks','숙제', presets.homework));

    wrap.appendChild(panel);
  });
}

function escapeAttr(s){ return (s||'').replace(/"/g,'&quot;'); }

function buildColBlock(day, key, label, presetArr){
  const block = el('div','col-block');
  block.appendChild(el('div','col-block-title', label));

  const chips = el('div','preset-chips');
  presetArr.forEach(p=>{
    const c = el('span','chip', p);
    c.onclick = ()=>{ addItem(day,key,p); };
    chips.appendChild(c);
  });
  block.appendChild(chips);

  const list = state.days[day][key];
  list.forEach((txt,i)=>{
    const row = el('div','item-row');
    const inp = document.createElement('input');
    inp.type='text'; inp.value=txt;
    inp.oninput = ()=>{ list[i]=inp.value; renderPage(); saveState(); };
    const del = el('button', null, '×');
    del.onclick = ()=>{ list.splice(i,1); renderSidebar(); renderPage(); saveState(); };
    row.appendChild(inp); row.appendChild(del);
    block.appendChild(row);
  });

  const addRow = el('div','add-item-row');
  const addInp = document.createElement('input');
  addInp.type='text'; addInp.placeholder='직접 입력 후 추가...';
  const addBtn = el('button', null, '+ 추가');
  const doAdd = ()=>{
    if(addInp.value.trim()){ addItem(day,key,addInp.value.trim()); addInp.value=''; }
  };
  addBtn.onclick = doAdd;
  addInp.onkeydown = (e)=>{ if(e.key==='Enter'){ e.preventDefault(); doAdd(); } };
  addRow.appendChild(addInp); addRow.appendChild(addBtn);
  block.appendChild(addRow);

  return block;
}

function addItem(day,key,txt){
  state.days[day][key].push(txt);
  renderSidebar(); renderPage(); saveState();
}

function renderPresetManager(){
  const mList = document.getElementById('materialPresetList');
  const hList = document.getElementById('homeworkPresetList');
  mList.innerHTML=''; hList.innerHTML='';
  presets.material.forEach((p,i)=>{
    const c = el('span','chip', p+'<span class="x">×</span>');
    c.querySelector('.x').onclick=(ev)=>{ ev.stopPropagation(); presets.material.splice(i,1); savePresets(); renderPresetManager(); renderSidebar(); };
    mList.appendChild(c);
  });
  presets.homework.forEach((p,i)=>{
    const c = el('span','chip', p+'<span class="x">×</span>');
    c.querySelector('.x').onclick=(ev)=>{ ev.stopPropagation(); presets.homework.splice(i,1); savePresets(); renderPresetManager(); renderSidebar(); };
    hList.appendChild(c);
  });
}

/* ---------------- Page (preview) rendering ---------------- */
function daytagSVG(fill){
  return `<svg viewBox="0 0 ${DAYTAG_VBW} ${DAYTAG_VBH}" preserveAspectRatio="none">
    <path d="${DAYTAG_FILL_D}" fill="${fill}" stroke="none"/>
    ${DAYTAG_STROKES}
  </svg>`;
}

function renderPage(){
  document.getElementById('titleText').textContent = 'Theseus 숙제표';
  document.getElementById('dateDisplay').textContent = '(' + state.dateRange + ')';

  const cont = document.getElementById('daysContainer');
  cont.innerHTML = '';

  const days = MODES[state.mode];
  let y = 130; // px, top of first day section
  const gap = 26;

  days.forEach((day, idx)=>{
    const d = state.days[day];
    const sec = el('div','day-section');
    sec.style.top = y + 'px';

    const tag = el('div','day-tag');
    tag.innerHTML = daytagSVG(TAG_FILL[day]) + `<div class="day-tag-label">${day}</div>`;
    sec.appendChild(tag);

    const body = el('div','day-body');

    if(d.wordTestOn){
      const wtRow = el('div','wt-row');
      wtRow.innerHTML = `<span class="badge-pill"><span class="dot"></span>단어 시험<span class="dot"></span></span>`;
      const wtSpan = el('div', null, escapeHTML(d.wordTest) || '<span style="color:#ccc">(단어시험 내용을 입력하세요)</span>');
      wtSpan.style.fontSize='14px'; wtSpan.style.fontFamily="'MabiClassic'"; wtSpan.style.flex='1'; wtSpan.style.fontWeight='500';
      wtRow.appendChild(wtSpan);
      body.appendChild(wtRow);
      body.appendChild(el('hr','hr-line'));
    }

    const twoCol = el('div','two-col');
    twoCol.appendChild(buildColView('가져올 교재', d.materials, '•'));
    twoCol.appendChild(buildColView('숙제', d.homeworks, '□'));
    body.appendChild(twoCol);

    sec.appendChild(body);
    cont.appendChild(sec);

    // measure height after insertion (placeholder, actual measured in layout pass)
    cont.appendChild(document.createComment(day));
  });

  // layout pass: measure each section's rendered height and stack them
  requestAnimationFrame(()=>{
    let yy = 130;
    const sections = cont.querySelectorAll('.day-section');
    sections.forEach(sec=>{
      sec.style.top = yy + 'px';
      yy += sec.offsetHeight + gap;
    });
    positionFooter(yy);
  });
}

function buildColView(label, list, marker){
  const col = el('div','col');
  const badgeWrap = el('div','col-badge-wrap');
  badgeWrap.innerHTML = `<span class="badge-pill"><span class="dot"></span>${label}<span class="dot"></span></span>`;
  col.appendChild(badgeWrap);
  if(list.length===0){
    col.appendChild(el('div','col-empty-hint','(항목 없음)'));
  }
  list.forEach(txt=>{
    const item = el('div','list-item');
    item.innerHTML = `<span class="marker">${marker}</span><span class="txt">${escapeHTML(txt)}</span>`;
    col.appendChild(item);
  });
  return col;
}

function escapeHTML(s){
  const d = document.createElement('div'); d.innerText = s||''; return d.innerHTML;
}

function positionFooter(topY){
  const fw = document.getElementById('footerWrap');
  fw.style.top = (topY+4) + 'px';
  const page = document.getElementById('page');
  const needed = topY + 4 + 180 + 30;
  page.style.minHeight = Math.max(1040, needed) + 'px';
}

/* ---------------- Init & events ---------------- */
function starPoints(){
  // simple 5-point star, slight hand-drawn asymmetry
  const cx=26, cy=23, rOuter=21, rInner=12.5;
  const jitter = [0,-0.6,0.5,-0.4,0.6,-0.5,0.4,-0.6,0.5,0.3];
  let pts=[];
  for(let i=0;i<10;i++){
    const r = i%2===0 ? rOuter : rInner;
    const a = (-90 + i*36) * Math.PI/180;
    const jr = r + jitter[i];
    pts.push((cx+jr*Math.cos(a)).toFixed(1)+','+(cy+jr*Math.sin(a)).toFixed(1));
  }
  return pts.join(' ');
}

function injectSVGPoints(){
  const sp = starPoints();
  document.querySelectorAll('.star-deco polygon').forEach(p=>p.setAttribute('points', sp));
}

async function init(){
  await loadState();
  document.getElementById('modeMWF').onclick = ()=>{ state.mode='mwf'; ensureDays(); renderSidebar(); renderPage(); saveState(); };
  document.getElementById('modeHMY').onclick = ()=>{ state.mode='hmy'; ensureDays(); renderSidebar(); renderPage(); saveState(); };
  document.getElementById('dateRange').oninput = (e)=>{ state.dateRange = e.target.value; renderPage(); saveState(); };

  document.getElementById('dayPanels').addEventListener('change', (e)=>{
    if(e.target.classList.contains('wtOnChk')){
      const day = e.target.dataset.day;
      state.days[day].wordTestOn = e.target.checked;
      renderSidebar(); renderPage(); saveState();
    }
  });
  document.getElementById('dayPanels').addEventListener('input', (e)=>{
    if(e.target.classList.contains('wtInput')){
      const day = e.target.dataset.day;
      state.days[day].wordTest = e.target.value;
      renderPage(); saveState();
    }
  });

  document.getElementById('presetAddBtn').onclick = ()=>{
    const target = document.getElementById('presetTarget').value;
    const val = document.getElementById('presetInput').value.trim();
    if(!val) return;
    presets[target].push(val);
    document.getElementById('presetInput').value='';
    savePresets(); renderPresetManager(); renderSidebar();
  };
  document.getElementById('presetInput').onkeydown = (e)=>{
    if(e.key==='Enter'){ e.preventDefault(); document.getElementById('presetAddBtn').click(); }
  };

  document.getElementById('btnPrint').onclick = ()=>{ window.print(); };
  document.getElementById('btnPng').onclick = async ()=>{
    const page = document.getElementById('page');
    const canvas = await html2canvas(page, {scale:3, backgroundColor:'#ffffff'});
    const link = document.createElement('a');
    link.download = 'theseus_숙제표_' + state.dateRange.replace(/[^0-9a-zA-Z-]/g,'') + '.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  };

  injectSVGPoints();
  renderSidebar();
  renderPresetManager();
  renderPage();

  // seed default presets if empty (first run)
  if(presets.material.length===0 && presets.homework.length===0){
    presets.material = ['Reading 메인북','Reading 워크북','Listening 메인북','Listening 워크북','문법 메인북','문법 워크북'];
    presets.homework = ['리딩 워크북 풀기','리딩 워크북 채점','리스닝 워크북 풀기','리스닝 워크북 채점','잉코 해석','문법 워크북 채점'];
    savePresets(); renderPresetManager(); renderSidebar();
  }
}
init();
</script>
